<nav
  [class.scrolled]="isScrolled()"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.bg-navy-900]="isScrolled()"
  [class.shadow-lg]="isScrolled()"
  [class.border-b]="isScrolled()"
  [class.border-white]="isScrolled()"
  [class.border-opacity-5]="isScrolled()"
  role="navigation"
  aria-label="Main navigation"
>
  <div class="section-container">
    <div class="flex items-center justify-between h-18">
      <!-- Logo -->
      <a
        routerLink="/"
        (click)="navigateToHome(); $event.preventDefault()"
        class="flex items-center gap-2.5 group tap-target cursor-pointer"
        aria-label="Webify & Co - Home"
      >
        <img
          src="assets/images/webify-mark.png"
          alt="Webify Logo"
          class="h-8 sm:h-9 w-auto object-contain transition-transform duration-300 group-hover:scale-105"
        />
        <div class="flex flex-col">
          <span class="font-heading font-black text-xl tracking-tight text-white leading-none">
            webify<span class="text-purple-400">.</span>
          </span>
          <span class="text-[9px] uppercase tracking-widest font-bold text-electric-400 leading-tight mt-0.5">
            Build. Brand. Grow.
          </span>
        </div>
      </a>

      <!-- Desktop nav links -->
      <div class="hidden md:flex items-center gap-1">
        @for (item of navItems; track item.label) {
          <button
            type="button"
            (click)="handleNavClick(item)"
            class="relative px-3.5 py-2 text-sm font-medium rounded-lg transition-all duration-200 tap-target text-slate-300 hover:text-white hover:bg-white/5 flex items-center gap-1.5"
          >
            <span>{{ item.label }}</span>
            @if (item.isNew) {
              <!-- Glowing top superscript NEW pill -->
              <span class="absolute -top-1.5 right-0 px-1.5 py-0.2 text-[8px] font-black uppercase tracking-wider rounded-full bg-gradient-to-r from-rose-500 via-purple-500 to-electric-500 text-white shadow-lg ring-1 ring-white/30 animate-pulse">
                NEW
              </span>
            }
          </button>
        }
      </div>

      <!-- Desktop CTA & Theme Toggle -->
      <div class="hidden md:flex items-center gap-3">
        <!-- Dark mode toggle -->
        <button
          (click)="themeService.toggle()"
          class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (themeService.theme() === 'dark') {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          }
        </button>

        <a
          routerLink="/contact"
          class="btn-primary text-sm"
          id="nav-get-quote-btn"
        >
          Get a Free Quote
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden w-10 h-10 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200 tap-target"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle mobile menu"
        aria-controls="mobile-menu"
      >
        @if (isMobileMenuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile menu dropdown -->
  @if (isMobileMenuOpen()) {
    <div
      id="mobile-menu"
      class="md:hidden bg-navy-900 border-t border-white/5 px-4 pb-6 pt-4"
      role="menu"
    >
      <div class="flex flex-col gap-1 mb-4">
        @for (item of navItems; track item.label) {
          <button
            type="button"
            (click)="handleNavClick(item)"
            class="text-left px-4 py-3 text-base font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 tap-target flex items-center justify-between"
            role="menuitem"
          >
            <span>{{ item.label }}</span>
            @if (item.isNew) {
              <span class="px-2 py-0.5 text-[9px] font-black uppercase rounded-full bg-gradient-to-r from-rose-500 to-purple-500 text-white shadow-sm ring-1 ring-white/20">
                NEW
              </span>
            }
          </button>
        }
      </div>

      <div class="flex items-center gap-3 pt-4 border-t border-white/5">
        <button
          (click)="themeService.toggle()"
          class="flex-1 py-3 text-sm font-medium text-slate-400 hover:text-white border border-white/10 rounded-xl transition-all tap-target flex items-center justify-center gap-2"
        >
          @if (themeService.theme() === 'dark') {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            Light Mode
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            Dark Mode
          }
        </button>

        <a
          routerLink="/contact"
          (click)="isMobileMenuOpen.set(false)"
          class="flex-1 btn-primary text-sm justify-center"
          id="mobile-get-quote-btn"
        >
          Get a Free Quote
        </a>
      </div>
    </div>
  }
</nav>

<!-- Spacer to prevent content going under sticky nav -->
<div class="h-[72px]"></div>
