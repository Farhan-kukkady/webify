<section class="section-padding bg-navy-800/40 relative overflow-hidden">
  <div class="section-container">
    <!-- Header -->
    <div class="text-center mb-16 reveal">
      <span class="section-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        FAQ
      </span>
      <h2 class="text-display-lg font-heading text-white mb-4">
        Common <span class="gradient-text">Questions</span>
      </h2>
      <p class="text-slate-400 text-lg max-w-2xl mx-auto">
        Everything you need to know before getting started. Still have questions? Just ask!
      </p>
    </div>

    <!-- Accordion -->
    <div class="max-w-3xl mx-auto space-y-3">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div
          class="border rounded-2xl overflow-hidden transition-all duration-300 reveal"
          [class.border-electric-500]="openIndex() === i"
          [class.bg-gradient-card]="openIndex() === i"
          [class.border-white]="openIndex() !== i"
          [class.border-opacity-10]="openIndex() !== i"
          [class.bg-navy-800]="openIndex() !== i"
          [style.transition-delay]="(i * 60) + 'ms'"
          [id]="'faq-' + i"
        >
          <!-- Question button -->
          <button
            (click)="toggle(i)"
            class="w-full flex items-center justify-between px-6 py-5 text-left transition-all duration-200 tap-target"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-answer-' + i"
          >
            <span
              class="font-semibold text-base pr-4 font-heading transition-colors duration-200"
              [class.text-white]="true"
              [class.text-electric-300]="openIndex() === i"
            >
              {{ faq.question }}
            </span>
            <div
              class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-all duration-300"
              [class.bg-electric-500]="openIndex() === i"
              [class.bg-white]="openIndex() !== i"
              [class.bg-opacity-10]="openIndex() !== i"
              [class.rotate-45]="openIndex() === i"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
            </div>
          </button>

          <!-- Answer -->
          @if (openIndex() === i) {
            <div
              [id]="'faq-answer-' + i"
              class="px-6 pb-5 text-slate-400 text-sm leading-relaxed border-t border-white/5"
              role="region"
            >
              <p class="pt-4">{{ faq.answer }}</p>
            </div>
          }
        </div>
      }
    </div>

    <!-- Still have questions? -->
    <div class="text-center mt-12 reveal">
      <p class="text-slate-400 mb-4">Still have a question we didn't answer?</p>
      <a
        routerLink="/contact"
        class="btn-secondary inline-flex items-center gap-2"
      >
        Ask Us Directly
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</section>
